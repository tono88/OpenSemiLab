services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      OPENSEMILAB_CORS_ORIGINS: http://localhost:5173
      OPENSEMILAB_EDA_WORKER_URL: http://eda-worker:9000
    depends_on:
      eda-worker:
        condition: service_healthy
  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api
  eda-worker:
    build: ./services/eda-worker
    expose:
      - "9000"
    environment:
      OPENSEMILAB_JOB_TIMEOUT: "90"
      # No total wall-clock limit for an active LibreLane flow. A separate
      # inactivity watchdog still stops a genuinely silent/stuck process.
      OPENSEMILAB_PHYSICAL_TIMEOUT: "0"
      OPENSEMILAB_PHYSICAL_IDLE_TIMEOUT: "3600"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=1536m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 6g
    cpus: 4.0

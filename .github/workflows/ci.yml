name: CI
on:
  push:
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/eda-worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys ngspice ghdl
      - run: python -m unittest discover -s tests -v
        env: { OPENSEMILAB_REQUIRE_EDA_TOOLS: '1' }
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm install
      - run: npm test
      - run: npm run build
  devsim-integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/devsim-worker } }
    env:
      DEVSIM_MATH_LIBS: liblapack.so.3:libblas.so.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3
      - run: pip install -e '.[dev]'
      - run: pytest -q

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensemilab-api"
version = "0.1.0"
description = "Engine-neutral orchestration API for OpenSemiLab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/opensemilab_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

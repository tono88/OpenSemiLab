[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensemilab-devsim"
version = "0.1.0"
description = "Local DEVSIM companion for OpenSemiLab"
requires-python = ">=3.11"
dependencies = [
  "devsim==2.11.0",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
opensemilab-devsim = "opensemilab_devsim.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/opensemilab_devsim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
